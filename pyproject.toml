[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "resolutions-2027-agent"
version = "1.0.0"
description = "AI-powered 2027 Resolutions Atelier Agent built with Google ADK for December year-end social celebrations."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
  "google-adk>=1.4.0",
  "google-genai>=1.16.0",
  "google-cloud-secret-manager>=2.21.0",
  "google-cloud-dlp>=3.25.0",
  "google-cloud-firestore>=2.19.0",
  "google-cloud-discoveryengine>=0.13.0",
  "google-cloud-logging>=3.11.0",
  "opentelemetry-api>=1.28.0",
  "opentelemetry-sdk>=1.28.0",
  "opentelemetry-exporter-gcp-trace>=1.8.0",
  "python-json-logger>=3.1.0",
  "pydantic>=2.9.0",
  "sqlalchemy>=2.0.36",
  "aiosqlite>=0.20.0",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "httpx>=0.27.0",
  "ruff>=0.8.0",
]

[tool.setuptools.packages.find]
include = ["resolutions_agent*", "app_server*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
